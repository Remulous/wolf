name: Docker build

on:
  workflow_dispatch:
  push:
    branches:
      - stable

# GITHUB_TOKEN is sufficient for publishing packages owned by this repository.
permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/remulous/wolf

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/stable' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}-${{ github.sha }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build GPU Drivers
        uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/gpu-drivers.Dockerfile
          push: true
          tags: ghcr.io/remulous/gpu-drivers:2025.05
          cache-from: type=gha,scope=gpu-drivers
          cache-to: type=gha,mode=max,scope=gpu-drivers

      - name: Build Gstreamer
        uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/gstreamer.Dockerfile
          push: true
          build-args: |
            GSTREAMER_VERSION=1.26.7
            BASE_IMAGE=ghcr.io/remulous/gpu-drivers:2025.05
          tags: ghcr.io/remulous/gstreamer:1.26.7
          cache-from: type=gha,scope=gstreamer
          cache-to: type=gha,mode=max,scope=gstreamer

      # context: . is the checkout above: it is never replaced with upstream Wolf.
      - name: Build Wolf from the checked-out fork revision
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wolf.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/remulous/gstreamer:1.26.7
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=wolf
          cache-to: type=gha,mode=max,scope=wolf

  test_devcontainer:
    runs-on: ubuntu-latest
    needs: buildx
    steps:
      - name: Checkout the triggering revision
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run tests in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageTag: devcontainer
          imageName: ${{ env.REGISTRY_IMAGE }}
          cacheFrom: ${{ env.REGISTRY_IMAGE }}:buildcache
          push: never
          runCmd: |
            set -euo pipefail

            cmake -S . -B build \
                  -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_CXX_STANDARD=20 \
                  -DCMAKE_CXX_EXTENSIONS=OFF \
                  -DADD_STACKTRACE_INFO=OFF \
                  -DTEST_VIRTUAL_INPUT=OFF \
                  -DTEST_DOCKER=OFF \
                  -DTEST_RUST_WAYLAND=OFF \
                  -DTEST_NVIDIA=OFF \
                  -DTEST_EXCEPTIONS=OFF \
                  -DTEST_UHID=OFF \
                  -G Ninja

            cmake --build build --target wolftests --parallel "$(nproc)"
            ./build/tests/wolftests
